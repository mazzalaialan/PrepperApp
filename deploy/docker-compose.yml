# Herramientas de Supervivencia por VikArg autoalojado con HTTPS automático (Caddy + Let's Encrypt).
# Uso: copiar .env.example a .env, completar DOMAIN, y correr
#   docker compose up -d --build
# Guía completa: docs/SERVIDOR.md

services:
  vikarg:
    build:
      context: ..
    image: vikarg-survival:latest
    restart: unless-stopped
    environment:
      # Contacto que exige Web Push: un mailto: o, si no se quiere dar un mail, la URL del servidor.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://${DOMAIN}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      TRANSFER_MAX_MB: ${TRANSFER_MAX_MB:-50}
      MAPS_DIR: /maps
      LIBRARY_DIR: /library
      DATA_PACKS_DIR: /packs
      # Clave de la biblioteca: la misma con la que se cifraron los libros con derechos (tools/library-builder).
      LIBRARY_KEY: ${LIBRARY_KEY:-}
      # Aviso por mail cuando una fuente externa no responde (ver docs/SERVIDOR.md).
      SMTP_URL: ${SMTP_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-contacto.vikarg@gmail.com}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      # Clave de la API del IOC (mareógrafos medidos); vacía, esa función queda apagada.
      IOC_API_KEY: ${IOC_API_KEY:-}
    volumes:
      - vikarg-data:/data
      # Mapas offline (vector.pmtiles y elevation.pmtiles); vacía, la app usa las fuentes públicas. Ver docs/SERVIDOR.md.
      - ${MAPS_PATH:-./maps}:/maps:ro
      # Paquetes de la biblioteca (catalog.json y books/), los que arma tools/library-builder (run.sh package).
      - ${LIBRARY_PATH:-./library}:/library:ro
      # Paquetes de datos que se regeneran cada mes (server/src/data/update-data.sh, por cron).
      - ${DATA_PACKS_PATH:-./data-packs}:/packs:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - vikarg

volumes:
  vikarg-data:
  caddy-data:
