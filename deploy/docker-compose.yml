# VikArg Prepping Tools autoalojado con HTTPS automático (Caddy + Let's Encrypt).
# Uso: copiar .env.example a .env, completar DOMAIN, y correr
#   docker compose up -d --build
# Guía completa: docs/SERVIDOR.md

services:
  vikarg:
    build:
      context: ..
    image: vikarg-survival:latest
    restart: unless-stopped
    environment:
      # Contacto que exige Web Push: un mailto: o, si no se quiere dar un mail, la URL del servidor.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-https://${DOMAIN}}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      TRANSFER_MAX_MB: ${TRANSFER_MAX_MB:-50}
    volumes:
      - vikarg-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - vikarg

volumes:
  vikarg-data:
  caddy-data:
