name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Construye la imagen autoalojable y verifica que arranca y sirve la app.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t vikarg-survival .
      - run: |
          docker run -d --name vikarg -p 8080:8080 vikarg-survival
          for i in $(seq 1 30); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          curl -fs http://localhost:8080/api/health | grep -q vapidPublicKey
          curl -fs http://localhost:8080/ | grep -q "VikArg Prepping Tools"
          docker logs vikarg

  # Paquete para usar la app sin internet en una PC (ver portable/LEEME.txt).
  portable:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # Sin BASE_PATH: se sirve en la raíz de localhost:47613.
      - run: npm run build
        working-directory: app
      - id: pack
        run: |
          VERSION=$(node -p "require('./app/package.json').version")
          DIR="VikArg-Survival-$VERSION"
          mkdir "$DIR"
          cp -r app/dist "$DIR/app"
          # Marca que la app usa para saber que es el paquete portable (y avisar versiones nuevas).
          echo '{"portable":true}' > "$DIR/app/portable.json"
          cp portable/* "$DIR/"
          chmod +x "$DIR/iniciar.sh" "$DIR/servidor.py"
          zip -rq "vikarg-survival-portable-$VERSION.zip" "$DIR"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: portable
          path: vikarg-survival-portable-*.zip

  deploy:
    needs: [build, server, docker, portable]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Una Release por versión, con el paquete portable; si ya existe, se reemplaza el archivo.
  # Solo queda publicada la última: las anteriores se borran (sus tags quedan en el historial).
  release:
    needs: [deploy, portable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.portable.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: portable
      - run: |
          if ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "VikArg Prepping Tools $VERSION" \
              --notes "App: https://mazzalaialan.github.io/PrepperApp — Para usarla sin internet en una PC, descargá el paquete portable y seguí LEEME.txt."
          fi
          gh release upload "v$VERSION" vikarg-survival-portable-*.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
            grep -vx "v$VERSION" |
            while read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes; done
